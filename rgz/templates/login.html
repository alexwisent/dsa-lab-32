{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<h2>Вход</h2>
<form method="post">
    <label>Логин:</label>
    <input type="text" name="login" required>

    <label>Пароль:</label>
    <input type="password" name="password" required>

    <button type="submit">Войти</button>
</form>
<p>Нет аккаунта? <a href="{{ url_for('reg') }}">Зарегистрироваться</a></p>
{% endblock %}
